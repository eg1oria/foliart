# An empty value — not `close` — for a request without `Upgrade:`. `close` would
# be forwarded to Node on every ordinary page request, which tears the socket
# down after each response and makes the `keepalive` pools below dead weight.
# An empty `proxy_set_header` value removes the header entirely, so nginx keeps
# the connection and only real WebSocket handshakes get `Connection: upgrade`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

map $request_method $admin_login_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $admin_login_limit_key zone=admin_login:10m rate=5r/m;

# `keepalive_timeout` must stay strictly below the idle timeout of the Node
# process behind it, otherwise nginx picks a pooled socket that Node has already
# closed and answers 502 — sporadically, on any path, with a retry succeeding
# and nothing in the application log. Both apps are pinned to 70s
# (`KEEP_ALIVE_TIMEOUT` for the frontend, `server.keepAliveTimeout` in the
# backend's bootstrap), so nginx at 60s always closes first.
upstream foliart_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream foliart_backend {
    server 127.0.0.1:5000;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name foliart.me www.foliart.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # Naming the canonical host rather than `$host` folds the http->https
        # and www->apex hops into one, so no crawler ever walks a redirect chain.
        return 301 https://foliart.me$request_uri;
    }
}

# Both hostnames used to answer with a 200 and the same pages, which splits
# every ranking signal between them and leaves crawlers to guess which one is
# canonical. `www` is a redirect-only host now; this is also what replaces the
# deprecated Yandex `Host:` directive that used to carry the intent in robots.txt.
server {
    listen 443 ssl http2;
    server_name www.foliart.me;

    ssl_certificate /etc/letsencrypt/live/foliart.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foliart.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://foliart.me$request_uri;
}

server {
    listen 443 ssl http2;
    server_name foliart.me;

    ssl_certificate /etc/letsencrypt/live/foliart.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foliart.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Four calendar images at 5 MiB each, one 20 MiB PDF, plus multipart metadata.
    client_max_body_size 44M;

    # The default `proxy_buffer_size` is one page — 4k — and it has to hold the
    # whole upstream header block or nginx answers 502 with "upstream sent too
    # big header". An article page already spends ~2.3k on the CSP and ~1.1k on
    # the `Link:` header, which carries the page's own URL five times over (four
    # hreflang alternates plus x-default). On the longest slugs that lands within
    # ~120 bytes of the limit, so those pages sat on the wrong side of it while
    # their shorter neighbours were fine — a per-URL failure that looks random
    # from the outside. 16k leaves room for a slug twice as long.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # `/robots.txt` is rendered by the Next app, so a frontend restart or a
    # deploy window would otherwise answer it with a 502 — and a 5xx on
    # robots.txt is defined (RFC 9309 section 2.3.1.4) as "the entire site is
    # disallowed", which conforming crawlers keep honouring for hours after the
    # app is back. The app stays the single source of the policy; the fallback
    # below only guarantees that a crawler is never told the site is off limits.
    location = /robots.txt {
        proxy_pass http://foliart_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @robots_fallback;
        # The app renders this route dynamically and labels it
        # `max-age=0, must-revalidate`, so a crawler re-fetches robots.txt
        # before nearly every page. Each of those fetches is another chance to
        # hit a blip, and a crawler that cannot read robots.txt must treat the
        # whole site as disallowed (RFC 9309 section 2.3.1.4) — which it then
        # caches for hours. An hour of caching cuts the number of those
        # chances by orders of magnitude; the policy itself changes only on
        # deploy.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
        # `add_header` in a location cancels every inherited `add_header`, so the
        # server-level security headers must be repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location @robots_fallback {
        default_type text/plain;
        # Deliberately shorter than the app's own policy: this copy is served
        # only while the app is down, so it states the one thing that matters
        # then — crawling is allowed — and leaves the details to the app.
        add_header Cache-Control "public, max-age=300" always;
        # `add_header` in a location cancels every inherited `add_header`, so the
        # server-level security headers must be repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 200 "User-Agent: *\nAllow: /\nDisallow: /api/\nDisallow: /admin-api/\nDisallow: /search-index/\n\nSitemap: https://foliart.me/sitemap.xml\n";
    }

    location = /api {
        proxy_pass http://foliart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://foliart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location = /media {
        return 301 /media/;
    }

    location ^~ /media/ {
        rewrite ^/media/(.*)$ /images/$1 break;
        proxy_pass http://foliart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        # `add_header` in a location cancels every inherited `add_header`, so the
        # server-level security headers must be repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    location ^~ /_next/static/ {
        proxy_pass http://foliart_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `add_header` in a location cancels every inherited `add_header`, so the
        # server-level security headers must be repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    location ^~ /_next/image {
        proxy_pass http://foliart_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept $http_accept;
        access_log off;
    }

    location ~ ^/(ru|en|fr|es)/admin/login/?$ {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://foliart_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif|woff|woff2|ttf|otf)$ {
        proxy_pass http://foliart_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=86400" always;
        # `add_header` in a location cancels every inherited `add_header`, so the
        # server-level security headers must be repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    location / {
        proxy_pass http://foliart_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
